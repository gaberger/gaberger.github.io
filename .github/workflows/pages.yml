name: Deploy site to GitHub Pages

# Builds the Hugo site in site/ and publishes it two ways:
# - commits the built files to the root of master, which GitHub Pages serves
#   while its source is "Deploy from a branch";
# - uploads them as a Pages artifact, which is served once the source is
#   switched to "GitHub Actions".

on:
  push:
    branches: [master]
    paths:
      - "content/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.139.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          curl -sSL -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
      - name: Build
        working-directory: site
        run: hugo --minify --baseURL "https://gaberger.github.io/"
      - name: Commit built site to the repository root
        run: |
          rm -f hugo.deb
          cp -a site/public/. .
          git add -A -- . ':!site/public' ':!site/resources' ':!site/.hugo_build.lock'
          if git diff --cached --quiet; then
            echo "Built site unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish built site"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

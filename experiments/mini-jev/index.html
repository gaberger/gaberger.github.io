<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand-written driver</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
:root{--bg:#faf9f5;--card:#f0eee6;--text:#1f1e1d;--muted:#73726c;--border:rgba(0,0,0,.12);--accent-bg:#e6f1fb;--accent:#185fa5;--obs:#f0997b;--car:#1d9e75;--crash:#e24b4a;--fill:#9fe1cb}
@media (prefers-color-scheme:dark){:root{--bg:#1f1e1d;--card:#2b2a27;--text:#f5f4ef;--muted:#a3a29c;--border:rgba(255,255,255,.14);--accent-bg:#0c447c;--accent:#b5d4f4;--fill:#0f6e56}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:420px;padding:24px 16px}
h1{font-size:20px;font-weight:500;margin:0 0 4px}
p.sub{font-size:14px;color:var(--muted);margin:0 0 20px}
button{font:inherit;font-size:14px;color:var(--text);background:transparent;border:.5px solid var(--border);border-radius:8px;padding:8px;cursor:pointer}
button:hover{background:var(--card)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 16px}
.seg button.on{background:var(--accent-bg);color:var(--accent)}
.cell{height:38px;border-radius:6px;background:var(--card);display:flex;align-items:center;justify-content:center}
.bar{height:22px;border-radius:6px;background:var(--card);position:relative;overflow:hidden;flex:1}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--fill)}
.small{font-size:12px;color:var(--muted);margin:6px 0 0}
</style>
</head>
<body>
<main>
<h1>Hand-written driver</h1>
<p class="sub">Neural networks whose weights were written by hand, not trained. Every move below is a real forward pass.</p>
<div class="seg" id="seg">
<button data-k="deep" class="on">Deep net</button>
<button data-k="shallow">Shallow net</button>
<button data-k="random">Random</button>
</div>
<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start">
<div>
<div id="road" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:6px;border:.5px solid var(--border);border-radius:12px"></div>
<p class="small">Top row is 5 steps ahead</p>
</div>
<div>
<p style="font-size:13px;color:var(--muted);margin:0 0 8px">Network output</p>
<div id="probs"></div>
<div style="background:var(--card);border-radius:8px;padding:10px 12px;margin-top:12px">
<p style="font-size:13px;color:var(--muted);margin:0">Steps survived</p>
<p id="steps" style="font-size:24px;font-weight:500;margin:0">0</p>
<p id="msg" class="small" style="margin:0">Best: 0</p>
</div>
</div>
</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px">
<button id="play"><i class="ti ti-player-play"></i> Play</button>
<button id="reset"><i class="ti ti-refresh"></i> New road</button>
</div>
</main>
<script>

function mul(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function row(){path=Math.max(0,Math.min(L-1,path+Math.floor(rng()*3)-1));const r=[0,1,2].map(()=>rng()<0.45?1:0);r[path]=0;return r}
function reset(){rng=mul(seed++);lane=1;path=1;grid=[[0,0,0],[0,0,0]];for(let i=2;i<R;i++)grid.push(row());steps=0;dead=false;think();draw()}
function state(){const x=[0,0,0];x[lane]=1;grid.forEach(r=>x.push(...r));return x}
function run(layers,x){let h=x;layers.forEach(([W,b],i)=>{const z=W.map((w,j)=>w.reduce((s,v,k)=>s+v*h[k],b[j]));h=i<layers.length-1?z.map(v=>Math.max(0,v)):z});const m=Math.max(...h),e=h.map(v=>Math.exp(v-m)),s=e.reduce((a,b)=>a+b);return e.map(v=>v/s)}
function think(){probs=mode==="random"?[1/3,1/3,1/3]:run(WJ[mode],state())}
function step(){if(dead){reset();return}let a=mode==="random"?Math.floor(Math.random()*3):probs.indexOf(Math.max(...probs));lane=Math.max(0,Math.min(L-1,lane+a-1));if(grid[0][lane]){dead=true;best=Math.max(best,steps);draw();return}grid.shift();grid.push(row());steps++;best=Math.max(best,steps);think();draw()}
function draw(){let h="";for(let r=R-1;r>=0;r--)for(let l=0;l<L;l++)h+=`<div class="cell" style="${grid[r][l]?"background:var(--obs)":""}"></div>`;for(let l=0;l<L;l++){const c=l===lane;h+=`<div class="cell" style="${c?(dead?"background:var(--crash)":"background:var(--car)"):""}">${c?'<i class="ti ti-car" style="font-size:20px;color:#fff"></i>':""}</div>`}document.getElementById("road").innerHTML=h;
const top=probs.indexOf(Math.max(...probs)),hl=mode!=="random";document.getElementById("probs").innerHTML=probs.map((p,i)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:13px;width:40px;color:${i===top&&hl?"var(--text)":"var(--muted)"}">${NAMES[i]}</span><div class="bar"><div class="fill" style="width:${(p*100).toFixed(1)}%;${i===top&&hl?"background:var(--car)":""}"></div></div><span style="font-size:12px;width:34px;text-align:right">${Math.round(p*100)}%</span></div>`).join("");
document.getElementById("steps").textContent=steps;document.getElementById("msg").textContent=dead?`Crashed. Best: ${best}`:`Best: ${best}`}
function setPlay(on){const b=document.getElementById("play");if(on){timer=setInterval(()=>{step();if(dead&&timer)setTimeout(()=>{if(timer)reset()},900)},380);b.innerHTML='<i class="ti ti-player-pause"></i> Pause'}else{clearInterval(timer);timer=null;b.innerHTML='<i class="ti ti-player-play"></i> Play'}}
document.getElementById("play").onclick=()=>setPlay(!timer);
document.getElementById("reset").onclick=()=>{best=0;reset()};
document.querySelectorAll("#seg button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#seg button").forEach(x=>x.classList.remove("on"));b.classList.add("on");mode=b.dataset.k;best=0;reset()});
reset();
</script>
